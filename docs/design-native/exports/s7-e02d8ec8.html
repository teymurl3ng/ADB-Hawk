<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADB View - Wireless Pairing Code Entry</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#101319",
            "surface-dim": "#101319",
            "surface-bright": "#363940",
            "surface-container-lowest": "#0b0e14",
            "surface-container-low": "#191c21",
            "surface-container": "#1d2026",
            "surface-container-high": "#272a30",
            "surface-container-highest": "#32353b",
            "on-surface": "#e1e2ea",
            "on-surface-variant": "#c1c7d3",
            "outline-variant": "#414751",
            outline: "#8b919d",
            primary: "#a4c9ff",
            "primary-container": "#60a5fa",
            "on-primary-container": "#003a6b"
          },
          fontFamily: {
            sans: ["Geist", "-apple-system", "BlinkMacSystemFont", "Segoe UI Variable", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-size: 16px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-caret {
      animation: blink 1.1s step-start infinite;
    }
    .mica-backdrop {
      background-color: rgba(32, 35, 41, 0.94);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen flex items-center justify-center p-4 selection:bg-primary-container selection:text-on-primary-container font-sans">

  <!-- Windows 11 System Tray Flyout Container (376px fixed width) -->
  <div class="w-[376px] mica-backdrop rounded-lg border border-white/10 flex flex-col overflow-hidden relative select-none">

    <!-- Top App Bar -->
    <header class="flex justify-between items-center h-10 w-full px-3 bg-surface border-b border-white/5 rounded-t-lg">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[#60a5fa]">smartphone</span>
        <span class="text-[13.5px] font-semibold text-white tracking-tight">ADB View</span>
        <span class="font-mono text-[10px] px-1.5 py-0.5 rounded bg-white/5 text-white/60 tracking-tight">v1.0.41:5037</span>
      </div>
      <div class="flex items-center gap-1">
        <button type="button" class="w-7 h-7 flex items-center justify-center rounded text-[#60a5fa] hover:bg-white/5 transition-colors" title="Pin to top">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">push_pin</span>
        </button>
        <button type="button" class="w-7 h-7 flex items-center justify-center rounded text-white/60 hover:bg-white/5 hover:text-white transition-colors" title="More options">
          <span class="material-symbols-outlined">more_horiz</span>
        </button>
      </div>
    </header>

    <!-- Main Content Flow -->
    <div class="p-3 flex flex-col gap-3 custom-scrollbar">

      <!-- Section Subheader -->
      <div class="flex items-center justify-between px-0.5 text-[11px] font-medium text-white/50 tracking-wide">
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#60a5fa]"></span>
          <span>Wireless pairing</span>
        </div>
        <span class="text-white/40 font-mono text-[10.5px]">mDNS Active</span>
      </div>

      <!-- Pairing Card in Code-Entry State -->
      <section class="rounded-lg bg-white/[0.04] border border-[#60a5fa]/30 p-[14px] flex flex-col relative shadow-sm">
        
        <!-- Header row -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-[#60a5fa] text-[18px]">wifi_tethering</span>
            <h2 class="text-[14.5px] font-semibold text-white">Galaxy S24</h2>
          </div>
          <span class="text-[11px] font-medium text-[#60a5fa] bg-[#60a5fa]/10 px-2 py-0.5 rounded border border-[#60a5fa]/20">
            Wi-Fi pairing
          </span>
        </div>

        <!-- Instruction text -->
        <p class="text-[12px] text-white/65 mt-2.5 mb-3 leading-normal">
          Enter the six-digit code shown on the phone.
        </p>

        <!-- 6-digit slots container -->
        <div class="grid grid-cols-6 gap-2 w-full my-1">
          <!-- Slot 1 (filled) -->
          <div class="h-9 rounded bg-black/40 border border-white/10 flex items-center justify-center text-[15px] font-semibold text-white">
            2
          </div>
          <!-- Slot 2 (filled) -->
          <div class="h-9 rounded bg-black/40 border border-white/10 flex items-center justify-center text-[15px] font-semibold text-white">
            4
          </div>
          <!-- Slot 3 (filled) -->
          <div class="h-9 rounded bg-black/40 border border-white/10 flex items-center justify-center text-[15px] font-semibold text-white">
            8
          </div>
          <!-- Slot 4 (active with blinking caret & subtle focus ring) -->
          <div class="h-9 rounded bg-black/50 border border-[#60a5fa] ring-1 ring-[#60a5fa]/60 flex items-center justify-center">
            <span class="w-[1.5px] h-4 bg-[#60a5fa] rounded-full animate-caret inline-block"></span>
          </div>
          <!-- Slot 5 (empty) -->
          <div class="h-9 rounded bg-black/40 border border-white/10 flex items-center justify-center text-[13px] text-white/30 font-medium">
            _
          </div>
          <!-- Slot 6 (empty) -->
          <div class="h-9 rounded bg-black/40 border border-white/10 flex items-center justify-center text-[13px] text-white/30 font-medium">
            _
          </div>
        </div>

        <!-- Port discovery hint -->
        <div class="flex items-center justify-between text-[11px] text-white/40 mt-2.5 px-0.5">
          <span>Port 39421 (auto-detected)</span>
          <span class="font-mono text-[10.5px]">192.168.1.144</span>
        </div>

        <!-- Actions Row -->
        <div class="mt-3.5 pt-3 border-t border-white/[0.08] flex items-center justify-end gap-2">
          <button type="button" class="px-3 py-1.5 rounded text-[12px] font-medium text-white/65 hover:text-white hover:bg-white/5 transition-colors">
            Cancel
          </button>
          <button type="button" class="px-3.5 py-1.5 rounded bg-[#60a5fa] text-[#0b0e14] text-[12px] font-semibold hover:bg-[#78b3fb] active:scale-[0.98] transition-all flex items-center gap-1 shadow-sm">
            <span>Pair</span>
            <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
          </button>
        </div>

      </section>

      <!-- Alternate Action Entry Points -->
      <div class="flex flex-col gap-2">
        <button type="button" class="w-full h-9 px-3 rounded-lg bg-white/[0.03] hover:bg-white/[0.06] border border-white/[0.06] flex items-center justify-between text-[12px] text-white/75 hover:text-white transition-colors">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-white/60 text-[16px]">link</span>
            <span>Pair a device over Wi-Fi</span>
          </div>
          <span class="material-symbols-outlined text-white/40 text-[16px]">chevron_right</span>
        </button>

        <button type="button" class="w-full h-9 px-3 rounded-lg bg-white/[0.03] hover:bg-white/[0.06] border border-white/[0.06] flex items-center justify-between text-[12px] text-white/75 hover:text-white transition-colors">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-white/60 text-[16px]">settings_ethernet</span>
            <span>Direct IP connect (192.168.x.x)</span>
          </div>
          <span class="font-mono text-[10px] text-white/40">Ctrl+K</span>
        </button>
      </div>

      <!-- Paired Devices List Section -->
      <div class="flex flex-col gap-2 mt-1">
        <div class="flex items-center justify-between px-0.5 text-[11px] font-medium text-white/50">
          <span>Paired devices (1)</span>
          <button type="button" class="text-white/40 hover:text-white/70 transition-colors flex items-center gap-1">
            <span class="material-symbols-outlined text-[13px]">refresh</span>
            <span>Refresh</span>
          </button>
        </div>

        <div class="rounded-lg bg-white/[0.03] border border-white/[0.06] p-2.5 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-7 h-7 rounded bg-white/[0.04] border border-white/[0.06] flex items-center justify-center text-white/60">
              <span class="material-symbols-outlined text-[16px]">tablet_android</span>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center gap-1.5">
                <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#4ade80]"></span>
                <span class="text-[12.5px] font-semibold text-white/90">Pixel Tablet</span>
              </div>
              <div class="text-[11px] text-white/45 font-mono">192.168.1.142:5555 · USB-C</div>
            </div>
          </div>
          <div class="flex items-center gap-1 text-white/40">
            <button type="button" class="p-1 hover:text-white hover:bg-white/5 rounded transition-colors" title="Open terminal">
              <span class="material-symbols-outlined text-[15px]">terminal</span>
            </button>
            <button type="button" class="p-1 hover:text-white hover:bg-white/5 rounded transition-colors" title="Mirror screen">
              <span class="material-symbols-outlined text-[15px]">cast</span>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Daemon Status Footer -->
    <footer class="h-9 px-3 bg-surface border-t border-white/5 flex items-center justify-between text-[11.5px] text-white/60">
      <div class="flex items-center gap-1.5">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#4ade80]"></span>
        <span>Daemon running · :5037</span>
      </div>
      <button type="button" class="flex items-center gap-1 text-[#f87171]/80 hover:text-[#f87171] transition-colors font-medium">
        <span class="material-symbols-outlined text-[14px]">power_settings_new</span>
        <span>Kill server</span>
      </button>
    </footer>

  </div>

</body>
</html>
