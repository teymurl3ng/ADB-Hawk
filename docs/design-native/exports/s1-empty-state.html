<style>
    body {
      background-color: #0b0e14;
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .fluent-shell {
      background: rgba(32, 35, 41, 0.94);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .fluent-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen w-full flex items-center justify-center p-4 selection:bg-primary-container selection:text-surface">
<!-- Desktop Simulation Host Wrapper -->
<main class="relative flex items-center justify-center">
<!-- Tray Flyout Shell: locked to 376px -->
<div class="fluent-shell w-[376px] rounded-xl overflow-hidden text-on-surface select-none">
<!-- TopAppBar Component (from Shared Components JSON anchor) -->
<header class="flex justify-between items-center h-10 w-full px-space-md border-b border-outline-variant/30 bg-surface dark:bg-surface shadow-sm docked full-width top rounded-t-lg">
<!-- Leading Icon & Brand Anchor -->
<div class="flex items-center gap-2 pl-1">
<span class="material-symbols-outlined text-primary-container dark:text-primary-container text-[18px] leading-none" data-icon="smartphone">smartphone</span>
<span class="text-headline-sm font-headline-sm font-semibold text-on-surface dark:text-on-surface tracking-tight">ADB View</span>
</div>
<!-- Trailing Single Control: Pin Toggle -->
<div class="flex items-center">
<button aria-label="Pin flyout" class="w-7 h-7 flex items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant/50 hover:text-on-surface transition-colors active:scale-[0.99] duration-150 rounded" id="pin-button" type="button">
<span class="material-symbols-outlined text-[17px] leading-none transition-transform rotate-45" data-icon="push_pin" id="pin-icon">push_pin</span>
</button>
</div>
</header>
<!-- Main Body Content Canvas -->
<div class="px-3 pb-3 pt-3 space-y-3">
<!-- Empty State Card -->
<section class="fluent-card rounded-lg py-6 px-4 flex flex-col items-center justify-center text-center">
<!-- Central Circular Glyph Container -->
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-white/[0.03] border border-white/[0.08] mb-3 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px] leading-none" data-icon="smartphone">smartphone</span>
</div>
<!-- Main Status Headline -->
<h2 class="text-headline-sm font-headline-sm font-semibold text-on-surface tracking-tight mb-1.5">
            No devices connected
          </h2>
<!-- Descriptive Body Text -->
<p class="text-body-md font-body-md text-on-surface-variant leading-relaxed max-w-[220px] mx-auto">
            Attach a device via USB or connect over Wi-Fi to observe ADB state.
          </p>
</section>
<!-- Action Row Button -->
<button class="group w-full bg-white/[0.04] hover:bg-white/[0.07] border border-white/[0.08] rounded-lg py-[9px] px-3.5 flex items-center justify-center gap-2 cursor-pointer transition-colors duration-150 active:scale-[0.99]" type="button">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface text-[15px] leading-none transition-colors" data-icon="wifi">wifi</span>
<span class="text-label-md font-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">
            Pair a device over Wi-Fi
          </span>
</button>
</div>
</div>
</main>
<script>
    // Pin toggle micro-interaction
    const pinBtn = document.getElementById('pin-button');
    const pinIcon = document.getElementById('pin-icon');
    let isPinned = false;

    if (pinBtn && pinIcon) {
      pinBtn.addEventListener('click', () => {
        isPinned = !isPinned;
        if (isPinned) {
          pinIcon.style.fontVariationSettings = "'FILL' 1";
          pinIcon.classList.remove('rotate-45');
          pinBtn.classList.add('text-primary-container');
          pinBtn.classList.remove('text-on-surface-variant');
        } else {
          pinIcon.style.fontVariationSettings = "'FILL' 0";
          pinIcon.classList.add('rotate-45');
          pinBtn.classList.remove('text-primary-container');
          pinBtn.classList.add('text-on-surface-variant');
        }
      });
    }
  </script>
</body></html>
