<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADB View - QR Wireless Pairing</title>

  <!-- Google Material Symbols Outlined for Windows 11 Fluent line icon simulation -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Geist and JetBrains Mono for system-grade typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --fluent-bg: #202329;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #e1e2ea;
      --text-secondary: rgba(255, 255, 255, 0.64);
      --text-tertiary: rgba(255, 255, 255, 0.45);
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
    }

    body {
      font-family: "Geist", "Segoe UI Variable Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: #0b0e14;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
      font-size: 16px;
    }

    /* Windows 11 Flyout Mica Surface */
    .fluent-flyout {
      width: 376px;
      background-color: rgba(32, 35, 41, 0.94);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .top-light-highlight {
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    }

    @keyframes subtle-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    .pulse-dot {
      animation: subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>

<body>

  <!-- Windows 11 System Tray Flyout Container (Exact 376px width) -->
  <aside class="fluent-flyout top-light-highlight select-none" aria-label="ADB View Flyout">
    
    <!-- Header / Top Bar -->
    <header class="flex items-center justify-between h-10 px-3.5 border-b border-white/[0.08] bg-black/10">
      <div class="flex items-center space-x-2">
        <span class="material-symbols-outlined text-white/70" aria-hidden="true">smartphone</span>
        <span class="text-[13.5px] font-semibold tracking-tight text-[#e1e2ea]">ADB View</span>
        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white/[0.06] text-white/60 border border-white/[0.06]">v1.0.41:5037</span>
      </div>
      <div class="flex items-center space-x-1">
        <button type="button" class="w-7 h-7 flex items-center justify-center rounded text-white/60 hover:text-white hover:bg-white/[0.08] transition-colors" title="Pin to top">
          <span class="material-symbols-outlined text-[15px]">push_pin</span>
        </button>
        <button type="button" class="w-7 h-7 flex items-center justify-center rounded text-white/60 hover:text-white hover:bg-white/[0.08] transition-colors" title="More options">
          <span class="material-symbols-outlined text-[16px]">more_horiz</span>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="p-3.5 flex flex-col gap-3">
      
      <!-- Sub-header Row: Wireless pairing status -->
      <div class="flex items-center justify-between px-0.5">
        <div class="flex items-center space-x-2">
          <span class="relative flex h-2 w-2">
            <span class="pulse-dot absolute inline-flex h-full w-full rounded-full bg-[#60a5fa] opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-[#60a5fa]"></span>
          </span>
          <span class="text-[12px] font-medium text-white/90">Wireless pairing</span>
        </div>
        <div class="flex items-center space-x-1.5 px-2 py-0.5 rounded bg-white/[0.04] border border-white/[0.06]">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span class="text-[10px] font-mono text-white/60">mDNS Active</span>
        </div>
      </div>

      <!-- Pairing Card: QR Mode -->
      <section class="bg-white/[0.04] border border-white/[0.08] rounded-lg p-[14px] flex flex-col relative top-light-highlight">
        
        <!-- Card Accent Header -->
        <div class="flex items-center space-x-2 mb-3">
          <span class="material-symbols-outlined text-[17px] text-[#60a5fa]" aria-hidden="true">qr_code_scanner</span>
          <h2 class="text-[13.5px] font-semibold text-[#60a5fa] m-0">Pair a device over Wi-Fi</h2>
        </div>

        <!-- Centered 220 x 220 px White Rounded QR Code Panel -->
        <div class="w-[220px] h-[220px] bg-white rounded-lg p-3 shadow-md mx-auto my-1 flex items-center justify-center select-none">
          <!-- High-density procedural SVG QR Code pattern -->
          <svg class="w-full h-full text-black" viewBox="0 0 33 33" fill="currentColor" shape-rendering="crispEdges">
            <!-- Finder pattern: Top-Left -->
            <rect x="0" y="0" width="7" height="7"/>
            <rect x="1" y="1" width="5" height="5" fill="white"/>
            <rect x="2" y="2" width="3" height="3"/>
            
            <!-- Finder pattern: Top-Right -->
            <rect x="26" y="0" width="7" height="7"/>
            <rect x="27" y="1" width="5" height="5" fill="white"/>
            <rect x="28" y="2" width="3" height="3"/>
            
            <!-- Finder pattern: Bottom-Left -->
            <rect x="0" y="26" width="7" height="7"/>
            <rect x="1" y="27" width="5" height="5" fill="white"/>
            <rect x="2" y="28" width="3" height="3"/>

            <!-- Alignment Pattern (Center-right bottom) -->
            <rect x="22" y="22" width="5" height="5"/>
            <rect x="23" y="23" width="3" height="3" fill="white"/>
            <rect x="24" y="24" width="1" height="1"/>

            <!-- Timing Patterns -->
            <rect x="6" y="8" width="1" height="1"/><rect x="6" y="10" width="1" height="1"/><rect x="6" y="12" width="1" height="1"/><rect x="6" y="14" width="1" height="1"/><rect x="6" y="16" width="1" height="1"/><rect x="6" y="18" width="1" height="1"/><rect x="6" y="20" width="1" height="1"/><rect x="6" y="22" width="1" height="1"/><rect x="6" y="24" width="1" height="1"/>
            <rect x="8" y="6" width="1" height="1"/><rect x="10" y="6" width="1" height="1"/><rect x="12" y="6" width="1" height="1"/><rect x="14" y="6" width="1" height="1"/><rect x="16" y="6" width="1" height="1"/><rect x="18" y="6" width="1" height="1"/><rect x="20" y="6" width="1" height="1"/><rect x="22" y="6" width="1" height="1"/><rect x="24" y="6" width="1" height="1"/>

            <!-- Dense Modules Matrix (Credentials & Host data payload) -->
            <rect x="8" y="1" width="2" height="1"/><rect x="11" y="0" width="1" height="2"/><rect x="13" y="1" width="2" height="1"/><rect x="16" y="0" width="1" height="3"/><rect x="18" y="2" width="2" height="1"/><rect x="21" y="0" width="2" height="2"/><rect x="24" y="1" width="1" height="2"/>
            <rect x="8" y="3" width="1" height="2"/><rect x="10" y="4" width="2" height="1"/><rect x="13" y="3" width="1" height="3"/><rect x="15" y="4" width="3" height="1"/><rect x="19" y="4" width="1" height="2"/><rect x="21" y="3" width="2" height="1"/><rect x="24" y="4" width="1" height="1"/>
            <rect x="8" y="8" width="2" height="2"/><rect x="11" y="7" width="1" height="2"/><rect x="13" y="8" width="2" height="1"/><rect x="16" y="8" width="1" height="3"/><rect x="18" y="9" width="3" height="1"/><rect x="22" y="7" width="2" height="2"/><rect x="25" y="8" width="1" height="2"/><rect x="28" y="8" width="2" height="1"/><rect x="31" y="8" width="2" height="2"/>
            <rect x="0" y="8" width="2" height="1"/><rect x="3" y="8" width="2" height="2"/><rect x="1" y="10" width="2" height="1"/><rect x="4" y="11" width="1" height="2"/><rect x="2" y="13" width="3" height="1"/><rect x="0" y="15" width="2" height="2"/><rect x="3" y="17" width="2" height="1"/><rect x="1" y="19" width="3" height="1"/><rect x="4" y="21" width="1" height="3"/><rect x="2" y="24" width="2" height="1"/>
            
            <rect x="8" y="11" width="3" height="1"/><rect x="12" y="10" width="2" height="2"/><rect x="15" y="11" width="1" height="2"/><rect x="17" y="12" width="3" height="1"/><rect x="21" y="10" width="2" height="1"/><rect x="24" y="11" width="2" height="2"/><rect x="27" y="10" width="1" height="3"/><rect x="29" y="11" width="3" height="1"/>
            <rect x="8" y="13" width="1" height="3"/><rect x="10" y="14" width="3" height="1"/><rect x="14" y="13" width="2" height="2"/><rect x="17" y="14" width="1" height="3"/><rect x="19" y="14" width="2" height="1"/><rect x="22" y="13" width="1" height="2"/><rect x="24" y="14" width="3" height="1"/><rect x="28" y="14" width="2" height="2"/><rect x="31" y="13" width="1" height="3"/>
            
            <rect x="8" y="17" width="2" height="2"/><rect x="11" y="16" width="2" height="1"/><rect x="14" y="16" width="1" height="3"/><rect x="16" y="18" width="2" height="1"/><rect x="19" y="16" width="3" height="1"/><rect x="23" y="17" width="1" height="2"/><rect x="25" y="16" width="2" height="2"/><rect x="28" y="17" width="2" height="1"/><rect x="31" y="17" width="2" height="2"/>
            <rect x="8" y="20" width="1" height="2"/><rect x="10" y="21" width="3" height="1"/><rect x="14" y="20" width="2" height="1"/><rect x="17" y="20" width="1" height="3"/><rect x="19" y="21" width="2" height="1"/><rect x="22" y="20" width="2" height="1"/><rect x="25" y="21" width="1" height="2"/><rect x="27" y="20" width="3" height="1"/><rect x="31" y="21" width="1" height="2"/>
            
            <rect x="8" y="23" width="3" height="1"/><rect x="12" y="22" width="1" height="3"/><rect x="14" y="24" width="2" height="1"/><rect x="17" y="24" width="3" height="1"/><rect x="21" y="23" width="1" height="2"/><rect x="27" y="23" width="2" height="2"/><rect x="30" y="24" width="2" height="1"/>
            <rect x="8" y="25" width="2" height="2"/><rect x="11" y="26" width="2" height="1"/><rect x="14" y="26" width="1" height="2"/><rect x="16" y="26" width="2" height="1"/><rect x="19" y="25" width="1" height="3"/><rect x="21" y="26" width="1" height="2"/><rect x="23" y="27" width="2" height="1"/><rect x="26" y="26" width="3" height="1"/><rect x="30" y="26" width="2" height="2"/>
            <rect x="8" y="28" width="1" height="3"/><rect x="10" y="29" width="3" height="1"/><rect x="14" y="29" width="2" height="2"/><rect x="17" y="28" width="2" height="1"/><rect x="20" y="29" width="2" height="1"/><rect x="23" y="29" width="1" height="3"/><rect x="25" y="28" width="2" height="2"/><rect x="28" y="29" width="3" height="1"/><rect x="32" y="29" width="1" height="2"/>
            <rect x="9" y="31" width="2" height="2"/><rect x="12" y="32" width="2" height="1"/><rect x="15" y="31" width="3" height="1"/><rect x="19" y="31" width="1" height="2"/><rect x="21" y="32" width="3" height="1"/><rect x="25" y="31" width="1" height="2"/><rect x="27" y="32" width="2" height="1"/><rect x="30" y="31" width="2" height="2"/>
          </svg>
        </div>

        <!-- Pairing Guidance Copy -->
        <div class="mt-3.5 space-y-1.5 px-0.5">
          <p class="text-[12px] leading-[17px] text-white/65 m-0">
            1. On the phone, open <span class="text-white/85 font-medium">Developer options → Wireless debugging</span>.
          </p>
          <p class="text-[12px] leading-[17px] text-white/65 m-0">
            2. Tap <span class="text-white/85 font-medium">Pair device with QR code</span> and point the camera at this code.
          </p>
        </div>

        <!-- Action Row (Right-aligned Ghost Cancel Button) -->
        <div class="mt-4 pt-2 border-t border-white/[0.06] flex items-center justify-between">
          <button type="button" class="text-[11.5px] text-[#60a5fa] hover:text-[#93c5fd] hover:underline flex items-center space-x-1 py-1">
            <span>Pair with code instead</span>
          </button>
          <button type="button" class="px-3.5 py-1.5 rounded text-[12px] font-medium text-white/75 hover:text-white hover:bg-white/[0.08] active:scale-[0.98] transition-all">
            Cancel
          </button>
        </div>
      </section>

      <!-- Collapsed Alternative Action Tile -->
      <button type="button" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg bg-white/[0.03] hover:bg-white/[0.06] border border-white/[0.06] text-left transition-all active:scale-[0.99] group">
        <div class="flex items-center space-x-2.5">
          <span class="material-symbols-outlined text-[16px] text-white/50 group-hover:text-white/80" aria-hidden="true">cable</span>
          <span class="text-[12px] text-white/75 group-hover:text-white/95">Direct IP connect (192.168.x.x)</span>
        </div>
        <kbd class="text-[10px] font-mono text-white/40 group-hover:text-white/60 bg-white/[0.04] px-1.5 py-0.5 rounded border border-white/[0.06]">Ctrl+K</kbd>
      </button>

    </main>

    <!-- System Daemon Footer -->
    <footer class="h-9 px-3.5 border-t border-white/[0.08] flex items-center justify-between bg-black/15">
      <div class="flex items-center space-x-2">
        <span class="w-1.5 h-1.5 rounded-full bg-[#4ade80]"></span>
        <span class="text-[11px] text-white/60">Daemon running · :5037</span>
      </div>
      <button type="button" class="text-[11px] text-[#f87171] hover:text-[#fca5a5] hover:bg-red-500/10 px-2 py-0.5 rounded transition-colors">
        Kill server
      </button>
    </footer>

  </aside>

</body>
</html>
