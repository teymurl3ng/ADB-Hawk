# Phase 10 packaging — build CI artifacts only (not a public GitHub Release).
# Does not publish releases, create version tags, or sign binaries.
name: release

on:
  workflow_dispatch:
  push:
    tags:
      # Future Phase 11 / v1 packaging evidence — still no GitHub Release publication.
      - 'v*'
      - 'phase-*-complete'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install pinned npm
        run: npm install -g npm@11.19.0

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Chocolatey is available on windows-latest. Pin a current Inno Setup 6.x package.
          choco install innosetup --version=6.7.1 -y --no-progress
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) {
            throw 'ISCC.exe not found after Inno Setup install.'
          }
          Write-Host "ISCC=$iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $props = Get-Content -LiteralPath Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') {
            throw 'Directory.Build.props <Version> not found.'
          }
          $version = $Matches[1].Trim()
          Write-Host "VERSION=$version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package (scripts/package.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Official WebView2 Evergreen bootstrapper is acquired by PackageCommon
          # (installer/redist/, gitignored). Do not commit it; do not SkipVerify.
          ./scripts/package.ps1 -InnoCompiler $env:ISCC

      - name: Validate packages (scripts/test-package.ps1)
        shell: pwsh
        run: ./scripts/test-package.ps1

      - name: Upload CI package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ADBView-${{ steps.version.outputs.version }}-packages
          path: |
            artifacts/release/${{ steps.version.outputs.version }}/ADBView-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/release/${{ steps.version.outputs.version }}/ADBView-${{ steps.version.outputs.version }}-win-x64-setup.exe
            artifacts/release/${{ steps.version.outputs.version }}/ADBView-${{ steps.version.outputs.version }}-win-arm64.zip
            artifacts/release/${{ steps.version.outputs.version }}/ADBView-${{ steps.version.outputs.version }}-win-arm64-setup.exe
            artifacts/release/${{ steps.version.outputs.version }}/ADBView-${{ steps.version.outputs.version }}-manifest.json
            artifacts/release/${{ steps.version.outputs.version }}/ADBView-${{ steps.version.outputs.version }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
